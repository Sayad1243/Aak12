<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шиба на крыше</title>
<style>
/* ===== Palette ===== */
:root {
  --ink: #2b1a2e;
  --night: #1b2453;
  --teal: #3a8f9d;
  --peach: #f59a78;
  --gold: #ffd37f;
  --sakura: #ffc1d4;
  --fur: #ec8a3f;
  --cream: #fff4e2;
  color-scheme: dark;
}
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--night); }
body {
  color: var(--cream);
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
.stage { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: var(--night); }

/* Derived shades for the illustration: pre-mixed from the palette as literals (no color-mix() dependency) */
.scene {
  display: block; width: 100%; height: 100%;
  --fur-hi: #f5ab5c;
  --cream-sh: #efd4cd;
  --shade: #5d2247;
  --bean: #faa1bb;
  --blush: #ff94b1;
  --wood: #fabf6d;
  --wood-sh: #c2713b;
  --mahog: #885036;
  --rose: #391f2b;
  --teal-sh: #346373;
  --far: #b4776d;
  --mid: #6e4f6a;
  --near: #1f2049;
  --rail: #281c35;
}
/* fills */
.k { fill: var(--ink); } .w { fill: #fff; } .fu { fill: var(--fur); } .fh { fill: var(--fur-hi); }
.cr { fill: var(--cream); } .bean { fill: var(--bean); } .tl { fill: var(--teal); } .tls { fill: var(--teal-sh); }
.gd { fill: var(--gold); } .nf { fill: none; }
.shade { fill: var(--shade); opacity: .3; }
/* line art: silhouette / inner / fine */
.ol  { stroke: var(--ink); stroke-width: 5.5; stroke-linejoin: round; stroke-linecap: round; }
.ol2 { stroke: var(--ink); stroke-width: 3.6; stroke-linejoin: round; stroke-linecap: round; }
.ol3 { stroke: var(--ink); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.rim { fill: none; stroke: var(--gold); stroke-width: 9; stroke-linecap: round; opacity: .85; }
/* limbs (outline stroke under fill stroke) */
.limbO { fill: none; stroke: var(--ink); stroke-width: 45; stroke-linecap: round; stroke-linejoin: round; }
.limbF { fill: none; stroke: var(--fur); stroke-width: 35; stroke-linecap: round; stroke-linejoin: round; }
.limbC { fill: none; stroke: var(--cream); stroke-width: 35; stroke-linecap: round; }
.limbS { fill: none; stroke: var(--shade); stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; opacity: .3; }  /* flush with the far edge */
.limbR { fill: none; stroke: var(--gold); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }  /* sun rim, lit edge */
/* guitar */
.gTop { fill: var(--wood); } .gSide { fill: var(--mahog); }
.gEdgeSh { fill: none; stroke: var(--wood-sh); stroke-width: 26; opacity: .55; }
.gEdgeHi { fill: none; stroke: #fff6dc; stroke-width: 9; opacity: .7; }
.binding { fill: none; stroke: var(--cream); stroke-width: 10; }
.rose { fill: var(--rose); } .hole { fill: #1e1016; }
.fret { stroke: #d9d2c8; stroke-width: 2; } .dot { fill: #f6eee0; }
.saddle { stroke: var(--cream); stroke-width: 3.5; stroke-linecap: round; }
.pickguard { fill: #6c3c2b; }
.str { fill: none; stroke-linecap: round; }
.strShadow { fill: none; stroke: var(--ink); stroke-width: 2.2; opacity: .35; }
.strLens { fill: #fff4d8; }
.glintBand { fill: #fffbea; }
/* background */
.cloudLit { fill: #ffe0a5; }
.cloudMid { fill: #f9aa9d; }
.cloudSh  { fill: #675f91; }
.streak { fill: #fab77c; opacity: .55; }
.cityFar { fill: var(--far); } .cityFarWin { fill: #ffe2b0; opacity: .5; }
.cityMid { fill: var(--mid); } .cityMidWin { fill: var(--gold); opacity: .55; }
.cityNear { fill: var(--near); } .cityNearWin { fill: var(--gold); opacity: .85; } .cityNearWin2 { fill: #9fd6dc; opacity: .6; }
.cityRim { fill: var(--gold); } .cityTop { fill: #ffcf96; }
.hazeBand { fill: url(#gHaze); }
.wire { fill: none; stroke: var(--rail); stroke-width: 2.2; }
.pole { fill: var(--rail); }
.railing { fill: var(--rail); }
.railRim { fill: none; stroke: var(--gold); stroke-width: 2.5; opacity: .7; }
.parapet { fill: #674d60; }
.parapetTop { fill: #f8ab7a; }
.seam { fill: none; stroke: var(--ink); stroke-width: 2; opacity: .12; }
.prop { fill: #26496d; } .propSh { fill: #1a2f4f; }
.propLt { fill: #8e948c; }
.pot { fill: #f1946b; } .potSh { fill: #b9605a; } .potHi { fill: #f8b98a; }
.beacon { fill: #ff4f5e; }
.star { fill: #fff8e6; }
.bird { fill: none; stroke: var(--rail); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.petal { fill: var(--sakura); }
.pf { opacity: .92; } .pb { opacity: .7; }
.noteO { fill: #fff; stroke: #fff; stroke-width: 7; stroke-linejoin: round; }
.n1 { fill: var(--gold); } .n2 { fill: var(--sakura); } .n3 { fill: #75b1ba; }
.speed, .wind { fill: #fff8ea; }
.smear { fill: none; stroke: #fffaf0; stroke-linecap: round; }
.sfx { font: 900 74px/1 ui-rounded, "SF Pro Rounded", "Nunito", "Arial Black", system-ui, sans-serif; letter-spacing: -1px;
  fill: var(--gold); stroke: var(--ink); stroke-width: 11; stroke-linejoin: round; paint-order: stroke; }
.sfxHi { fill: none; stroke: #fff; stroke-width: 3; opacity: .9; paint-order: normal; }
.spark1 { fill: #fffbe8; } .spark2 { fill: var(--gold); } .spark3 { fill: var(--sakura); }

/* ===== UI ===== */
.card {
  position: fixed; z-index: 2;
  top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left));
  padding: 10px 16px 11px; border-radius: 16px;
  background: rgba(27,36,83,0.62);
  border: 1px solid rgba(255,244,226,0.16);
  max-width: calc(100% - 32px);
  box-sizing: border-box;
  pointer-events: none;
}
.card h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .01em; line-height: 1.2; }
.card p { margin: 3px 0 0; font-size: 12.5px; font-weight: 600; opacity: .78; line-height: 1.3; }
.bar {
  position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
  bottom: max(16px, env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 6px;
  padding: 6px; border-radius: 999px;
  background: rgba(27,36,83,0.82);
  border: 1px solid rgba(255,244,226,0.18);
  box-shadow: 0 10px 30px rgba(43,26,46,0.45);
  max-width: calc(100% - 32px - env(safe-area-inset-left) - env(safe-area-inset-right));
  box-sizing: border-box; white-space: nowrap;
}
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 16px 0 13px; border: 0; border-radius: 999px;
  font: inherit; font-size: 15px; font-weight: 700; color: var(--cream);
  background: rgba(255,244,226,0.1);
  cursor: pointer; transition: background-color .15s, color .15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { background: rgba(255,244,226,0.18); }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
#playBtn:not(.is-playing) { background: var(--sakura); color: var(--ink); }   /* paused: «Играть» is the primary action */
.ico { width: 20px; height: 20px; fill: currentColor; flex: none; }
.ico .on, .is-playing .ico .play, .btn:not(.is-playing) .ico .pause { display: none; }
.btn[aria-pressed="true"] .ico .on { display: inline; }
.btn[aria-pressed="true"] .ico .off { display: none; }
.chords { display: flex; gap: 2px; margin: 0 6px 0 4px; padding: 0; list-style: none; font-size: 13px; font-weight: 800; }
/* only the incoming chip animates, so two chips are never lit at once */
.chords li { padding: 5px 8px; border-radius: 999px; opacity: .5; }
.chords li.on { opacity: 1; color: var(--ink); background: var(--sakura); transition: opacity .2s, background-color .2s, color .2s; }
.hint { font-size: 12px; font-weight: 600; opacity: .6; padding-right: 10px; }
@media (max-width: 899px) { .hint { display: none; } }
@media (max-width: 520px) {
  .chords li:not(.on) { display: none; }
  .chords { margin: 0 4px 0 2px; }
  .btn { padding: 0 14px 0 11px; }
  .card h1 { font-size: 15px; } .card p { font-size: 11.5px; }
}
@media (max-width: 319px) { .chords { display: none; } }   /* very narrow phones: the two buttons only */
</style>
</head>
<body>
<div class="stage">
<svg id="scene" class="scene" viewBox="-800 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img"
  aria-label="Аниме-сцена: рыжий шиба-ину сидит на ящике на крыше на закате и играет на акустической гитаре; вокруг летят лепестки сакуры и ноты.">
<defs id="defs">
  <linearGradient id="gSky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="780">
    <stop offset="0" style="stop-color:var(--night)"/>
    <stop offset=".3" style="stop-color:#2b5a78"/>
    <stop offset=".5" style="stop-color:#93a6b6"/>
    <stop offset=".68" style="stop-color:#f9a898"/>
    <stop offset=".84" style="stop-color:#fbb97c"/>
    <stop offset="1" style="stop-color:#ffe7b9"/>
  </linearGradient>
  <radialGradient id="gGlow" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="460">
    <stop offset="0" style="stop-color:#fffbe8"/>
    <stop offset=".1" style="stop-color:var(--gold);stop-opacity:.9"/>
    <stop offset=".34" style="stop-color:var(--peach);stop-opacity:.38"/>
    <stop offset="1" style="stop-color:var(--peach);stop-opacity:0"/>
  </radialGradient>
  <radialGradient id="gRay" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="900">

    <stop offset="1" style="stop-color:#fff3cf;stop-opacity:0"/>
  </radialGradient>
  <linearGradient id="gFloor" gradientUnits="userSpaceOnUse" x1="0" y1="776" x2="0" y2="1000">

    <stop offset="1" style="stop-color:#1e224c"/>
  </linearGradient>
  <linearGradient id="gHaze" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="772">
    <stop offset="0" style="stop-color:#ffcf9a;stop-opacity:0"/>
    <stop offset="1" style="stop-color:#ffcf9a;stop-opacity:.42"/>
  </linearGradient>
  <linearGradient id="gIris" gradientUnits="userSpaceOnUse" x1="0" y1="-33" x2="0" y2="33">
    <stop offset="0" stop-color="#24101a"/>
    <stop offset=".4" stop-color="#5a2621"/>
    <stop offset=".78" stop-color="#d5702e"/>
    <stop offset="1" stop-color="#ffc56c"/>
  </linearGradient>

  <!-- shared shapes -->
  <path id="pHead" d="M0 -146C82 -146 138 -102 148 -44C153 -18 157 0 163 16C157 20 153 24 151 28C159 34 161 42 159 50
    C147 50 139 54 131 58C107 86 63 98 0 98C-63 98 -107 86 -131 58C-139 54 -147 50 -159 50C-161 42 -159 34 -151 28

  <clipPath id="cpGBody"><use href="#pGBody"/></clipPath>

      L-131 19L-118 21C-107 28 -94 30 -80 29C-52 27 -26 12 -24 -14Z"/>

  <clipPath id="cpThighL"><use href="#pThighL"/></clipPath><clipPath id="cpShinL"><use href="#pShinL"/></clipPath>
  <path id="pSpark" d="M0 -1C.09 -.24 .24 -.09 1 0C.24 .09 .09 .24 0 1C-.09 .24 -.24 .09 -1 0C-.24 -.09 -.09 -.24 0 -1Z"/>

<!-- ===== Sky ===== -->
<rect x="-3000" y="-10" width="6000" height="1020" fill="url(#gSky)"/>
<g id="stars"></g>
<g id="sun">
  <g id="rays"></g>
  <circle r="460" fill="url(#gGlow)" id="sunGlow"/>
  <circle r="46" fill="#fffaf0"/>
</g>
<g id="streaks"></g>
<g id="clouds"></g>
<!-- ===== City (parallax) ===== -->
<g id="cityFar"></g>
<g id="haze"><ellipse rx="640" ry="2.6" class="spark2" opacity=".5"/></g>
<rect class="hazeBand" x="-3000" y="560" width="6000" height="212"/>
<g id="cityMid"></g>
<g id="birds"></g>
<g id="wires"></g>
<g id="cityNear"></g>
<g id="petalsBack"></g>
<!-- ===== Rooftop ===== -->
<g id="roof"></g>

<!-- gust wind streaks pass behind the dog -->
<path id="wind" class="wind" opacity="0"/>

<!-- ===== Character ===== -->
<g id="char">

  <ellipse cx="0" cy="164" rx="180" ry="13" class="k" opacity=".3"/>

  <!-- hind legs: thigh + shin share one silhouette (thick ink under-stroke, fills on top), knee overhang casts a hard shadow -->

    <g class="k" style="stroke:var(--ink)" stroke-width="10" stroke-linejoin="round">

      <use href="#pShinL" class="fu"/>

      <use href="#pThighL" class="fu"/>
      <g clip-path="url(#cpThighL)">

    <g id="legR">
      <use href="#pShinR" class="fu"/>

<script>
'use strict';
/* ================= 1. Helpers ================= */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, DEG = 180 / Math.PI;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - (1 - t) ** 3;
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;
function prng(seed) {             // mulberry32 — deterministic pseudo-random
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function make(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const circ = (x, y, r) => `M${r1(x - r)} ${r1(y)}a${r1(r)} ${r1(r)} 0 1 1 ${r1(2 * r)} 0a${r1(r)} ${r1(r)} 0 1 1 ${r1(-2 * r)} 0Z`;
const svg = $('scene');

/* ================= 2. Music: tempo, chords, strum pattern ================= */
const BPM = 96, SPB = 60 / BPM, BAR = 4 * SPB, SWING = 0.56;
const TUNING = [40, 45, 50, 55, 59, 64];                 // E A D G B E (MIDI)
const CHORDS = [                                          // «королевский» ход: IV – V – iii – vi
  { name: 'Fmaj7', frets: [1, 3, 3, 2, 1, 0], pos: 1 },
  { name: 'G',     frets: [3, 5, 5, 4, 3, 3], pos: 3 },
  { name: 'Em7',   frets: [0, 7, 9, 7, 8, 7], pos: 7 },
  { name: 'Am7',   frets: [5, 7, 5, 5, 5, 5], pos: 5 },
];
// D · D U · U D U  — [beat, direction (+1 down / −1 up), velocity]
const PATTERN = [[0, 1, 1], [1, 1, 0.8], [1.5, -1, 0.62], [2.5, -1, 0.66], [3, 1, 0.86], [3.5, -1, 0.7]];
const EPB = PATTERN.length;
const STROKE_SIZE = [1.15, 0.68, 1, 1, 0.68, 1, 1, 1];   // per eighth: real stroke vs. ghost (misses the strings)
const ACCENT = [1, 0.45, 0.72, 0.45];
const STROKE_DOWN = [0, 1, 2, 3, 4, 5].map((s, j) => [s, j * 0.011]);   // low → high, 11 ms apart
const STROKE_DOWN5 = STROKE_DOWN.slice(1).map(([s, t]) => [s, t - 0.011]);  // later downstrokes skip the bass string
const STROKE_UP = [5, 4, 3, 2].map((s, j) => [s, j * 0.009]);           // high → low, 9 ms apart
// boom-chuck (after draft c): the root on the low string only rings on the bar's first downstroke
const strokeStrings = ev => (ev.dir < 0 ? STROKE_UP : ev.k % EPB === 0 ? STROKE_DOWN : STROKE_DOWN5);

function eventAt(k) {
  const bar = Math.floor(k / EPB), [at, dir, vel] = PATTERN[k - bar * EPB];
  const beat = bar * 4 + (at % 1 ? Math.floor(at) + SWING : at);
  return { k, bar, t: beat * SPB, dir, vel, chord: CHORDS[bar % 4] };
}
function firstEventFrom(t) {
  let k = Math.max(0, Math.floor(t / BAR)) * EPB;
  while (eventAt(k).t < t) k++;
  return k;
}

/* ================= 3. Guitar geometry ================= */
const G = { x: -58, y: -98, a: -25 };                    // guitar placement in body space (layout() steepens it on tall screens)
const NUT = 392, SADDLE = -73, SCALE_LEN = NUT - SADDLE;
const fretX = n => NUT - SCALE_LEN * (1 - 2 ** (-n / 12));
const neckHalf = x => lerp(19, 15.5, (x - 76) / (NUT - 76));
const strY = (i, x) => lerp((i - 2.5) * 5.4, (i - 2.5) * 4, (x - SADDLE) / SCALE_LEN);
const POSTS = [[412, -12], [436, -14], [460, -16], [460, 16], [436, 14], [412, 12]];
const STR_W = [2.6, 2.3, 2, 1.6, 1.3, 1.1];
const STR_C = ['#ecc890', '#ecc890', '#ecc890', '#f5f0e6', '#f5f0e6', '#f5f0e6'];
const strings = [];

function buildGuitar() {
  let d = '';
  for (let n = 1; n <= 19; n++) { const x = fretX(n); if (x < 80) break; const h = neckHalf(x); d += `M${r1(x)} ${r1(-h)}V${r1(h)}`; }
  make('path', { d, class: 'fret' }, $('frets'));
  const mid = n => (fretX(n - 1) + fretX(n)) / 2;
  for (const n of [3, 5, 7, 9, 15, 17]) make('circle', { cx: r1(mid(n)), cy: 0, r: 3.6, class: 'dot' }, $('frets'));
  for (const y of [-7, 7]) make('circle', { cx: r1(mid(12)), cy: y, r: 3.4, class: 'dot' }, $('frets'));
  for (let i = 0; i < 6; i++) make('circle', { cx: -85, cy: r1((i - 2.5) * 5.4), r: 2.6 }, $('pins'));
  // tuners: shafts + pearl buttons on both headstock edges
  for (const [px, py] of POSTS) {
    const sgn = Math.sign(py), edge = 23 + (px - 404) * 0.05;
    make('path', { d: `M${px} ${sgn * edge}V${sgn * (edge + 9)}`, stroke: '#cfc6b8', 'stroke-width': 4 }, $('tuners'));
    make('ellipse', { cx: px, cy: sgn * (edge + 13), rx: 6.5, ry: 5, fill: '#f4ecdc', class: 'ol3' }, $('tuners'));
    make('circle', { cx: px, cy: py, r: 3.6, fill: '#d8d0c4', class: 'ol3' }, $('tuners'));
  }
  // strings: static part over the headstock + vibrating part (bridge → nut)
  const sg = $('strings');
  for (let i = 0; i < 6; i++) {
    const yN = strY(i, NUT);
    make('path', { d: `M${NUT} ${r1(yN)}L${POSTS[i][0]} ${POSTS[i][1]}`, class: 'str', stroke: STR_C[i], 'stroke-width': STR_W[i] }, sg);
    const shadow = make('path', { class: 'strShadow' }, sg);
    const lens = make('path', { class: 'strLens', opacity: 0 }, sg);
    const line = make('path', { class: 'str', stroke: STR_C[i], 'stroke-width': STR_W[i] }, sg);
    strings.push({ shadow, lens, line, y0: strY(i, SADDLE), y1: yN, last: -1 });
  }
}

/* ================= 4. Background (procedural, deterministic) ================= */
const CLOUDS = [], PETALS = [], STARS = [], TWINKLE = [], CITY = [];
let beacon = null;

function buildBackground() {

  }
  make('path', { d: ray, fill: 'url(#gRay)' }, $('rays'));
  // first stars in the upper sky
  for (let i = 0; i < 10; i++) {
    STARS.push({ el: make('use', { href: '#pSpark', class: 'star' }, $('stars')),
      x: rr(-900, 900), y: rr(28, 250), s: rr(3, 7.5), ph: rr(0, TAU), sp: rr(0.8, 2) });
  }
  // long thin lit streaks near the horizon

    make('rect', { x: r1(x), y: r1(y), width: r1(w), height: r1(h), rx: h / 2, class: 'streak' }, $('streaks'));
  }
  // cel-shaded cumulus clouds (lit from below-right by the setting sun)
  const specs = [[-640, 250, 400, 130], [180, 160, 500, 160], [800, 300, 340, 100], [-1300, 200, 420, 120], [1350, 220, 380, 110]];
  specs.forEach(([x, y, w, h], i) => {
    const puffs = [];
    const n = Math.max(4, Math.round(w / 48));
    for (let j = 0; j < n; j++) {
      const t = (j + 0.5) / n, cx = (t - 0.5) * w;
      const r = h * (0.3 + 0.46 * Math.sin(Math.PI * t)) * rr(0.85, 1.12);
      if (r > h * 0.46) puffs.push([cx + rr(-0.35, 0.35) * r, -r * 1.55, r * rr(0.5, 0.7)]);   // towering upper puffs

  TWINKLE.forEach(([x, y, s], i) => { TWINKLE[i] = make('rect', { x: r1(x), y: r1(y), width: s, height: r1(s * 1.3), class: 'cityNearWin' }, $('cityNear')); });

/* tail: fluffy curl from overlapping circles (outline layer under fill layer); the tip is a separate, lagging segment */

/* ================= 5. Layout (responsive composition) ================= */
const L = { vw: 1600, s: 0.95, cx: 0, cy: 0, sunX: 430, sunY: 590, portrait: false, sky: 0, sfx: [0, 0, 0] };
const charEl = $('char');
const EXT_L = -198, EXT_TOP = -582, EXT_BOT = 162;        // character extents (char space)
function layout() {
  const w = svg.clientWidth || window.innerWidth, h = svg.clientHeight || window.innerHeight;
  const vw = (1000 * w) / Math.max(1, h);
  svg.setAttribute('viewBox', `${r1(-vw / 2)} 0 ${r1(vw)} 1000`);
  const portrait = vw < 1000;
  L.vw = vw; L.portrait = portrait;
  // tall screens: a steeper neck narrows the silhouette, so the dog can be drawn bigger
  G.a = portrait ? -31 : -25;
  const right = portrait ? 374 : 408, half = (right - EXT_L) / 2, mid = (right + EXT_L) / 2;
  // keep the crate clear of the control bar on short screens
  const barTop = (document.querySelector('.bar').getBoundingClientRect().top / Math.max(1, h)) * 1000;
  const crateBottom = Math.max(760, Math.min(portrait ? 900 : 838, barTop - 12));
  L.s = Math.min(1, (crateBottom - 24) / (EXT_BOT - EXT_TOP), portrait ? (vw / 2 - 14) / half : 1);
  L.cy = crateBottom - 162 * L.s;
  L.cx = portrait ? -mid * L.s : -82 * L.s - vw * 0.035;
  // short landscape phones: slide the dog right until the title card clears its head
  const card = document.querySelector('.card').getBoundingClientRect(), u = 1000 / Math.max(1, h);
  const clear = card.right * u - vw / 2 + 12 - (L.cx - 165 * L.s);
  if (!portrait && card.bottom * u > L.cy + EXT_TOP * L.s && clear > 0) L.cx = Math.min(L.cx + clear, vw / 2 - 16 - right * L.s);
  L.sfx = portrait ? [mid, -672, -6] : [392, -446, -12];
  L.sky = portrait ? 120 : 0;                              // wires drop below the title card on phones
  L.sunX = portrait ? vw * 0.24 : vw * 0.27;
  L.sunY = portrait ? 455 : 588;
  $('sun').setAttribute('transform', `translate(${r1(L.sunX)} ${L.sunY})`);
  $('haze').setAttribute('transform', `translate(${r1(L.sunX)} ${L.sunY + 30})`);
  $('acUnit').setAttribute('transform', `translate(${r1(vw / 2 - 170)} 860)`);
  $('plant').setAttribute('transform', `translate(${r1(-vw / 2 + 120)} 850)`);
  for (const id of ['acUnit', 'plant']) $(id).setAttribute('display', vw < 1250 ? 'none' : 'inline');
  // backlit skyline: the edge facing the sun catches a warm rim, strongest near the sun
  for (const c of CITY) {
    if (!c.rims) continue;
    let dn = '', df = '';
    for (const [x, bw, top] of c.bld) {
      const dx = L.sunX - (x + bw / 2), ex = dx > 0 ? x + bw - c.rw : x;
      const seg = `M${r1(ex)} ${r1(top)}h${c.rw}V770h${-c.rw}Z`;
      if (Math.abs(dx) < 560) dn += seg; else df += seg;
    }
    c.rims[0].setAttribute('d', dn); c.rims[1].setAttribute('d', df);
  }
  // anime focus lines aimed at the dog's head
  const hx = L.cx, hy = L.cy - 430 * L.s, R0 = 560 * L.s + 60, R1 = 2400;
  let rnd = prng(5), d = '';
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * TAU + rnd() * 0.05, r0 = R0 + rnd() * 220, wdt = 0.005 + rnd() * 0.011;
    d += `M${r1(hx + Math.cos(a) * r0)} ${r1(hy + Math.sin(a) * r0)}`
      + `L${r1(hx + Math.cos(a - wdt) * R1)} ${r1(hy + Math.sin(a - wdt) * R1)}L${r1(hx + Math.cos(a + wdt) * R1)} ${r1(hy + Math.sin(a + wdt) * R1)}Z`;
  }
  $('speed').setAttribute('d', d);
  // horizontal wind streaks for the sakura gust (tapered wedges, scrolled in render)
  rnd = prng(17); d = '';
  for (let i = 0; i < 30; i++) {
    const y = 60 + rnd() * 880, x = (rnd() - 0.5) * (vw + 600), len = 160 + rnd() * 420, t = 1.2 + rnd() * 2.6;
    d += `M${r1(x)} ${r1(y)}L${r1(x + len)} ${r1(y - t)}L${r1(x + len)} ${r1(y + t)}Z`;
  }
  $('wind').setAttribute('d', d);
  L.hx = hx; L.hy = hy;
}

/* ================= 6. Rig pose — a pure function of the beat clock ================= */
const R = {};
['dog', 'bodyA', 'bodyB', 'head', 'earL', 'earR', 'ahoge', 'tail', 'tailTip', 'tailTipO', 'footR', 'footL', 'guitar', 'browL', 'browR',
 'blush', 'mouthC', 'mouthO', 'pawS', 'pawF', 'thumbF', 'glint', 'logo', 'speed', 'wind', 'flash', 'sunGlow', 'rays',
 'cityFar', 'cityMid', 'cityNear', 'wires', 'roof', 'bandTip', 'strap', 'strapF', 'strapS', 'smear', 'sfx'].forEach(id => { R[id] = $(id); });
const limb = id => { const k = [...$(id).children], get = c => k.find(e => e.classList.contains(c)) || null;
  return { o: get('limbO'), f: get('limbF'), c: get('limbC'), s: get('limbS'), r: get('limbR') }; };
const ARM_S = limb('armS'), ARM_FF = limb('armFF'), ARM_FU = limb('armFU');
const EYES = ['eyeL', 'eyeR'].map(id => { const g = $(id); return { open: g.querySelector('.eyeOpen'), shut: g.querySelector('.eyeShut'),
  happy: g.querySelector('.eyeHappy'), star: g.querySelector('.eyeStar'), pupil: g.querySelector('.pupil'), state: '' }; });
const SH_S = [-92, -230], SH_F = [90, -230];               // shoulders (body space)
const ELB_S = [-38, -80];                                  // strumming elbow rests on the guitar's upper bout (guitar space)
const UPPER = 96, FORE = 100;

// write an attribute only when its value changed (most rig parts are still between beats)
function set(el, k, v) { const c = el.__a || (el.__a = {}); if (c[k] !== v) { c[k] = v; el.setAttribute(k, v); } }
function setVis(el, on) { set(el, 'visibility', on ? 'visible' : 'hidden'); }

function warp(f) { return f < SWING ? (f / SWING) * 0.5 : 0.5 + ((f - SWING) / (1 - SWING)) * 0.5; }
function strumPose(beat) {
  const bi = Math.floor(beat), u = warp(beat - bi);
  const c = bi * 2 + u * 2, n = Math.floor(c);          // strings are crossed at integer eighth-slots
  const w = smooth(clamp((c - n - 0.3) / 0.4, 0, 1));   // change stroke size only at the turn-around
  const size = j => STROKE_SIZE[((j % 8) + 8) % 8];
  const amp = lerp(size(n), size(n + 1), w);
  const sn = Math.sin(TAU * u), shaped = Math.sign(sn) * Math.abs(sn) ** 0.6;   // fast through strings, hangs at ends
  return { sweep: amp * shaped, flick: -16 * Math.cos(TAU * u) * amp, ghost: clamp((1 - amp) / 0.32, 0, 1), real: size(Math.round(c)) > 0.9 };
}
function strumWrist(sp) {                                  // guitar space: forearm swings about the resting elbow
  const phi = (44 + (sp.sweep > 0 ? 17 : 26) * sp.sweep) / DEG;          // the up position clears the bass strings
  const reach = FORE - sp.ghost * 6 - 16 * Math.max(0, -sp.sweep) ** 2;  // ghosts pass above the strings; lift at the top
  return { phi, W: [ELB_S[0] + Math.cos(phi) * reach, ELB_S[1] + Math.sin(phi) * reach] };
}
function fretPose(beat) {
  const bar = Math.floor(beat / 4), inBar = beat - bar * 4;
  const k = clamp((inBar - 3.62) / 0.34, 0, 1);          // slide right before the next downbeat
  const a = CHORDS[bar % 4].pos, b = CHORDS[(bar + 1) % 4].pos;
  return { fx: fretX(lerp(a, b, easeInOut(k)) + 0.5), hop: Math.sin(Math.PI * k), look: smooth(clamp((inBar - 3.3) / 0.4, 0, 1)) };
}
function ik(S, T, a, b) {                                 // two-bone IK, elbow bends clockwise (down/out)
  const dx = T[0] - S[0], dy = T[1] - S[1];

  const W = [S[0] + Math.cos(ang) * d, S[1] + Math.sin(ang) * d];   // clamped reach keeps the paw attached

const pt = p => `${r1(p[0])} ${r1(p[1])}`;
function sideOffset(A, B, k) {                             // normal of a segment, flipped toward the shadow side (away from the sun)
  const dx = B[0] - A[0], dy = B[1] - A[1], l = Math.hypot(dx, dy) || 1;

function drawLimb(L_, S, E, W, sockFrom, merge = 0.4) {

  set(L_.o, 'd', `M${pt([lerp(S[0], E[0], merge), lerp(S[1], E[1], merge)])}${tail}`);  // no outline at the shoulder
  set(L_.f, 'd', `M${pt(S)}${tail}`);

  set(L_.s, 'd', shift(10.5));                             // hard cel shadow band, flush with the far edge
  if (L_.r) set(L_.r, 'd', shift(-15));                    // thin warm rim on the sun side

// the headbang curve: lowest on the beat, eases up, then whips down into the next beat (after draft b)
const nodCurve = p => (p < 0.62 ? 1 - easeOut(p / 0.62) : ((p - 0.62) / 0.38) ** 2);

const env = (x, len, a = 0.18, r = 0.3) => smooth(clamp(x / a, 0, 1)) * (1 - smooth(clamp((x - len) / r, 0, 1)));

// anime moments: every 4 bars on the Am7 bar, rotating hop → glint → sakura gust
function momentAt(beat) {

}

let lastBar = -1;
const chordEls = [...$('chords').children];

function render(song) {
  const mo = reduced ? 0.35 : 1, big = !reduced;          // motion amount; big FX only without reduced motion
  const beat = song / SPB, bi = Math.floor(beat), bf = beat - bi;
  const bar = Math.floor(beat / 4), bib = bi - bar * 4;
  const accent = ACCENT[bib];
  const imp = accent * Math.exp(-bf * 6);                 // beat impulse
  const M = momentAt(beat), m = M.m;
  const hopK = M.kind === 0 ? m : 99, glintK = M.kind === 1 ? m : 99, gustK = M.kind === 2 ? m : 99;
  const crouch = big && M.nextKind === 0 && M.pre > -1 ? Math.sin((Math.PI / 2) * (M.pre + 1)) : 0;
  // expression timing (deterministic pseudo-random)
  const hc = Math.floor(song / 7), hp = song - hc * 7 - 2.5;
  const joy = Math.max(hopK < 3 ? env(hopK * SPB, 2.3 * SPB) : 0, gustK < 3 ? env(gustK * SPB, 2.4 * SPB) : 0,
    hash(hc + 3) < 0.4 && hp > 0 ? env(hp, 1.1) : 0);
  const starry = glintK < 3 && env(glintK * SPB - 0.1, 2.2 * SPB) > 0.5;
  const happy = joy > 0.5 || crouch > 0.4 || hopK < 0.3;   // hopK bridges crouch → hop joy (no 1-frame open-eye pop)
  const bc = Math.floor(song / 3.1), bt = song - (bc * 3.1 + 0.3 + hash(bc) * 2.2);
  let blink = bt > 0 && bt < 0.16 ? Math.sin((Math.PI * bt) / 0.16) : 0;
  if (hash(bc + 77) < 0.28 && bt > 0.26 && bt < 0.42) blink = Math.sin((Math.PI * (bt - 0.26)) / 0.16);

  // whole dog: crouch on beat 4, hop off the crate on the downbeat, squash on landing
  let hopY = 0, sy = 1 - 0.05 * crouch;
  if (big && hopK < 1.4) {
    const air = hopK / 0.5, land = hopK - 0.5;
    if (air < 1) { hopY = 34 * 4 * air * (1 - air); sy = 1 + 0.05 * (1 - air); }

  set(R.dog, 'transform', `translate(0 ${r2(-hopY)}) scale(${(1 + (1 - sy) * 0.6).toFixed(4)} ${sy.toFixed(4)})`);

  // body: sway, breathing, squash on accents
  const breath = Math.sin((TAU * song) / 3.4);
  const sway = mo * (1.4 * Math.sin((TAU * beat) / 8) + 0.5 * imp);
  const sq = mo * 0.016 * imp;
  set(R.bodyA, 'transform', `rotate(${r2(sway)}) scale(${(1 + sq * 0.6 + 0.004 * breath * mo).toFixed(4)} ${(1 - sq + 0.009 * breath * mo).toFixed(4)})`);

  set(R.ahoge, 'transform', `rotate(${r2(mo * 14 * lag - tilt - 18 * gust * mo + flutter * 1.5)} 4 -138)`);

  const tapL = bib % 2 ? 0 : tapR * 0.6;

  const shut = happy || starry ? 0 : blink;

    const st = starry ? 'star' : happy ? 'happy' : shut > 0.72 ? 'shut' : 'open';
    if (st !== e.state) {

    if (st === 'open') {

      set(e.pupil, 'transform', `translate(${r1(4 * fp.look * (1 - fp.hop * 0.3))} ${r1(2 * fp.look)})`);

  set(R.browR, 'transform', `translate(0 ${r2(browUp)}) rotate(${r1(-14 + 10 * joy)} 56 -80)`);

  drawLimb(ARM_FF, aF.E, aF.E, aF.W, 0.45);
  const fretT = `translate(${G.x} ${G.y}) rotate(${r2(ga)}) translate(${r1(fp.fx)} ${r2(-fp.hop * 4)})`;
  set(R.pawF, 'transform', `${fretT} scale(${r2((1 + 0.08 * fp.hop) * press)})`);

    let amp = 0, fret = CHORDS[bar % 4].frets[i];

  set(R.speed, 'opacity', r2(focus));

    set(p.el, 'transform', `translate(${r1(x)} ${r1(y)}) rotate(${r1(p.spin * t + p.ph * 57)}) scale(${r2(sx)} ${r2(p.size)})`);
    if (p.front) {
      let k = 9;
      for (const [zx, zy, zr] of zones) k = Math.min(k, Math.hypot(x - zx, y - zy) / zr);
      set(p.el, 'opacity', r2(0.12 + 0.8 * smooth(clamp((k - 0.7) / 0.4, 0, 1))));
    }
  });
  STARS.forEach(s => {
    const tw = 0.25 + 0.75 * Math.abs(Math.sin(song * s.sp + s.ph)) ** 3;
    set(s.el, 'transform', `translate(${r1(s.x - cam)} ${s.y}) scale(${r2(s.s * (0.6 + 0.4 * tw))})`);
    set(s.el, 'opacity', r2(tw));
  });
  TWINKLE.forEach((el, i) => set(el, 'opacity', hash(Math.floor(song / 2.3 + i * 0.37) + i * 13) > 0.45 ? 0.9 : 0.12));
  set(beacon, 'opacity', song % 1.6 < 0.22 ? 1 : 0.18);
  const fp2 = clamp(((song + 8) % 24) / 14, 0, 1);         // flock crosses for 14 s of every 24 s
  BIRDS.forEach(b => {
    const x = lerp(-L.vw / 2 - 160, L.vw / 2 + 80, fp2) + b.dx - cam * 0.5, y = 300 - fp2 * 120 + b.dy + Math.sin(song * 1.3 + b.ph) * 4 + L.sky * 0.5;
    const f = Math.sin(song * 9 + b.ph) * 7 * mo;
    set(b.el, 'd', `M${r1(x - 9)} ${r1(y - f)}Q${r1(x - 4)} ${r1(y - f * 0.3)} ${r1(x)} ${r1(y + 2)}`
      + `Q${r1(x + 4)} ${r1(y - f * 0.3)} ${r1(x + 9)} ${r1(y - f)}`);
  });

  // chord indicator (only touches the DOM on bar change)
  if (bar !== lastBar) { lastBar = bar; chordEls.forEach((li, i) => li.classList.toggle('on', i === bar % 4)); }
}

/* ================= 7. Audio — Karplus–Strong plucked strings ================= */
const LOOKAHEAD = 0.15, MASTER = 0.9, FRAME = 0.016;
const audio = { ctx: null, master: null, down: null, up: null, bufs: new Map(), jobs: [], voices: [], last: [],
  on: false, nextK: 0, timer: 0, t0: 0, s0: 0 };
const midiHz = m => 440 * 2 ** ((m - 69) / 12);

// generators: rendered in slices by pumpJobs(), so building the samples never stalls a frame
function* ksBuffer(ctx, midi) {
  const sr = ctx.sampleRate, f = midiHz(midi);
  const n = Math.floor(sr * (midi <= 45 ? 2.8 : 1.7)), out = new Float32Array(n);   // bass roots ring through the bar
  // loop delay = N − ½ (two-tap average of the oldest samples) + all-pass fraction (kept in 0.1…1.1)
  const period = sr / f, N = Math.floor(period + 0.4), fr = period + 0.5 - N;
  const C = (1 - fr) / (1 + fr);
  const rho = 0.001 ** (1 / (f * (5 - (midi - 40) * 0.06)));       // per-period loss → T60 (low strings ring longer)
  const buf = new Float32Array(N), rnd = prng(midi * 31);
  let lp = 0, mean = 0;
  for (let i = 0; i < N; i++) { lp += (rnd() * 2 - 1 - lp) * 0.5; buf[i] = lp; mean += lp; }   // soft pick: low-passed noise
  mean /= N;
  for (let i = 0; i < N; i++) buf[i] -= mean;
  let idx = 0, apX = 0, apY = 0, peak = 1e-6;
  for (let i = 0; i < n; i++) {
    const nx = idx + 1 === N ? 0 : idx + 1, a = buf[idx];
    out[i] = a;
    const x = rho * 0.5 * (a + buf[nx]);
    const y = C * x + apX - C * apY; apX = x; apY = y;
    buf[idx] = y; idx = nx;
    const ab = a < 0 ? -a : a; if (ab > peak) peak = ab;
    if ((i & 8191) === 8191) yield;
  }
  const fade = Math.floor(sr * 0.08), g = 0.9 / peak;
  for (let i = 0; i < n; i++) out[i] *= g * (i > n - fade ? (n - i) / fade : 1);
  const ab = ctx.createBuffer(1, n, sr);
  ab.copyToChannel(out, 0);
  return ab;
}
function* makeIR(ctx) {                                    // small warm room
  const sr = ctx.sampleRate, len = Math.floor(sr * 2.2), ir = ctx.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c), rnd = prng(c + 9);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / sr; lp += (rnd() * 2 - 1 - lp) * 0.3; d[i] = lp * Math.exp(-t * 2.8) * Math.min(1, t / 0.015);
      if ((i & 16383) === 16383) yield;
    }
  }
  return ir;
}
function pumpJobs() {                                      // ≤ 6 ms of synthesis per task, then yield to rendering
  const t0 = performance.now();
  while (audio.jobs.length && performance.now() - t0 < 6) {
    const job = audio.jobs[0], r = job.gen.next();
    if (r.done) { job.done(r.value); audio.jobs.shift(); }
  }
  if (audio.jobs.length) setTimeout(pumpJobs, 0);
}
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  const ctx = new AC({ latencyHint: 'interactive' });
  const tone = (hz) => { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = hz; f.Q.value = 0.4; return f; };
  const down = tone(3800), up = tone(2300);                // upstrokes sound darker (after draft c)
  const body = ctx.createBiquadFilter(); body.type = 'peaking'; body.frequency.value = 120; body.Q.value = 1; body.gain.value = 3;
  const verb = ctx.createConvolver();
  const wet = ctx.createGain(); wet.gain.value = 0.3;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.25;
  const master = ctx.createGain(); master.gain.value = 0;
  down.connect(body); up.connect(body); body.connect(comp); body.connect(verb); verb.connect(wet); wet.connect(comp);
  comp.connect(master); master.connect(ctx.destination);
  // queue the samples: the chord that is playing now first, the reverb last
  const seen = new Set(), bar = Math.floor(song / BAR);
  for (let i = 0; i < 4; i++) {
    CHORDS[(bar + i) % 4].frets.forEach((f, s) => {
      const m = TUNING[s] + f;
      if (!seen.has(m)) { seen.add(m); audio.jobs.push({ gen: ksBuffer(ctx, m), done: b => audio.bufs.set(m, b) }); }
    });
  }
  audio.jobs.push({ gen: makeIR(ctx), done: b => { verb.buffer = b; } });
  Object.assign(audio, { ctx, down, up, master, last: new Array(6).fill(null) });
  pumpJobs();
  return true;
}
function playNote(s, midi, when, gain, bus) {
  const { ctx } = audio, buffer = audio.bufs.get(midi);
  if (!buffer) return;                                     // still being synthesised (first ~0.1 s only)
  const src = ctx.createBufferSource(), g = ctx.createGain(), pan = ctx.createStereoPanner();
  src.buffer = buffer;
  g.gain.setValueAtTime(gain, when);
  pan.pan.value = (s - 2.5) * 0.1;
  src.connect(g); g.connect(pan); pan.connect(bus);
  const prev = audio.last[s];                              // a string can only sound one note: choke the previous
  if (prev && prev.end > when) { prev.g.gain.setTargetAtTime(0, when, 0.015); prev.src.stop(when + 0.12); }
  src.start(when); src.stop(when + buffer.duration);
  const v = { src, g, start: when, end: when + buffer.duration };
  audio.last[s] = v; audio.voices.push(v);
  src.onended = () => {
    audio.voices.splice(audio.voices.indexOf(v), 1);
    if (audio.last[s] === v) audio.last[s] = null;
    src.disconnect(); g.disconnect(); pan.disconnect();
  };
}
function playStroke(ev, when) {
  const bus = ev.dir > 0 ? audio.down : audio.up;
  for (const [s, dt] of strokeStrings(ev)) {
    const gain = 0.2 * ev.vel * (ev.dir > 0 ? 1 : 0.85) * (0.9 + 0.2 * hash(ev.k * 7 + s));
    playNote(s, TUNING[s] + ev.chord.frets[s], when + dt, gain, bus);
  }
}
// song time ↔ AudioContext time: a fixed anchor (after draft b), latency-compensated so a strum is heard on the frame it is seen
function anchorAudio() {
  const { ctx } = audio;
  audio.t0 = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0) + FRAME;
  audio.s0 = song;
}
function scheduleAudio(song) {                             // look-ahead scheduler, driven by the visual beat clock
  const { ctx } = audio;
  if (!audio.on || !ctx || ctx.state !== 'running') return;
  const lat = ctx.outputLatency || ctx.baseLatency || 0;
  if (Math.abs(audio.t0 + (song - audio.s0) - (ctx.currentTime - lat + FRAME)) > 0.06) anchorAudio();   // re-anchor on drift
  for (;;) {
    const ev = eventAt(audio.nextK);
    if (ev.t - song > LOOKAHEAD + lat) break;              // + lat: high-latency outputs (Bluetooth) would otherwise schedule in the past
    audio.nextK++;
    const when = audio.t0 + (ev.t - audio.s0);
    if (when > ctx.currentTime - 0.02) playStroke(ev, Math.max(when, ctx.currentTime));
  }
}
function audioWake() {                                     // (re)start output in sync with the current beat
  const { ctx } = audio;
  clearTimeout(audio.timer);
  audio.nextK = firstEventFrom(song);
  ctx.resume().then(() => {
    if (!audio.on || !playing) return;
    audio.nextK = firstEventFrom(song);
    anchorAudio();
    const t = ctx.currentTime;
    audio.master.gain.cancelScheduledValues(t);
    audio.master.gain.setTargetAtTime(MASTER, t, 0.05);
  }, () => {});
}
function audioSleep() {                                    // drop not-yet-started notes, fade the tail, then suspend
  const { ctx } = audio;
  if (!ctx) return;
  const t = ctx.currentTime;
  for (const v of audio.voices.slice()) if (v.start > t) v.src.stop();
  audio.master.gain.cancelScheduledValues(t);
  audio.master.gain.setTargetAtTime(0, t, 0.08);
  clearTimeout(audio.timer);
  audio.timer = setTimeout(() => {                          // silence ringing tails too, so they don't resume on wake
    if (ctx.state === 'running' && (!audio.on || !playing || document.hidden)) { for (const v of audio.voices.slice()) v.src.stop(); ctx.suspend(); }
  }, 450);
}

/* ================= 8. Beat clock, loop & controls ================= */
const mqReduce = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mqReduce.matches;
let playing = !reduced;
let song = reduced ? 13.05 * SPB : 0;                     // still pose for reduced motion: mid sparkle moment
let raf = 0, lastNow = 0;

function frame(now) {
  raf = 0;
  if (!playing || document.hidden) return;
  song += Math.min(0.1, Math.max(0, (now - lastNow) / 1000));   // clamp: no time jumps after stalls
  lastNow = now;
  render(song);
  scheduleAudio(song);
  raf = requestAnimationFrame(frame);
}
function startLoop() {
  if (raf || !playing || document.hidden) return;
  lastNow = performance.now();
  raf = requestAnimationFrame(frame);
}

const playBtn = $('playBtn'), soundBtn = $('soundBtn'), playLbl = $('playLbl');
function syncUI() {
  const label = playing ? 'Пауза' : 'Играть';
  playBtn.setAttribute('aria-label', label);
  playLbl.textContent = label;
  playBtn.classList.toggle('is-playing', playing);
  soundBtn.setAttribute('aria-pressed', String(audio.on));
}
function togglePlay() {
  playing = !playing;
  if (playing) { startLoop(); if (audio.on) audioWake(); }
  else { if (raf) cancelAnimationFrame(raf); raf = 0; if (audio.on) audioSleep(); }
  syncUI();
}
function toggleSound() {
  if (!audio.on) {
    if (!audio.ctx && !initAudio()) { soundBtn.disabled = true; return; }
    audio.on = true;
    if (playing) audioWake(); else audioSleep();          // paused: keep the context suspended until Play
  } else {
    audio.on = false;
    audioSleep();
  }
  syncUI();
}
playBtn.addEventListener('click', togglePlay);
soundBtn.addEventListener('click', toggleSound);
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const onControl = e.target instanceof Element && e.target.closest('button, input, select, textarea, a');
  if (e.code === 'Space' && !onControl) { e.preventDefault(); togglePlay(); }
  else if (e.code === 'KeyM') { e.preventDefault(); toggleSound(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = 0; if (audio.on) audioSleep(); }
  else if (playing) { startLoop(); if (audio.on) audioWake(); }
});
mqReduce.addEventListener('change', e => { reduced = e.matches; render(song); });
window.addEventListener('resize', () => { layout(); render(song); });

buildGuitar();
buildBackground();
buildTail();
buildBirds();
buildFx();
layout();
render(song);
syncUI();
startLoop();
</script>
